<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="meteoBG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="meteoIcon" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="55%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Dark circle background -->
  <circle cx="200" cy="200" r="200" fill="url(#meteoBG)"/>

  <!-- Icon: cloud + sun filling the circle, no padding -->
  <g transform="translate(200, 175)">
    <!-- Cloud body — large, offset up-left -->
    <path d="M-88 18
             a46 46 0 0 1 46 -46
             a52 52 0 0 1 96 -6
             a40 40 0 0 1 40 40
             a34 34 0 0 1 -34 34
             h-114
             a34 34 0 0 1 -34 -22
             z"
          fill="url(#meteoIcon)"/>

    <!-- Sun: white crescent to right of cloud (like PharmaSys) -->
    <circle cx="72" cy="6" r="34" fill="#FFFFFF"/>
    <circle cx="82" cy="0" r="30" fill="url(#meteoBG)"/>
  </g>

  <!-- Wordmark: HDM (white) + METEO (accent teal) -->
  <text x="200" y="318"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="800"
        letter-spacing="-1.5"
        fill="#FFFFFF">HDM</text>
  <text x="200" y="378"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="6"
        fill="#2DD4BF">METEO</text>
</svg>